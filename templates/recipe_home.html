<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>GenAI C6 Recipe Pages</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top, rgba(255, 247, 220, 0.95), transparent 32%),
                linear-gradient(160deg, #f0d4a3, #f8eee2 58%, #f3dcc3);
            color: #351707;
        }

        .panel {
            width: min(760px, 100%);
            padding: 36px;
            border-radius: 28px;
            background: rgba(255, 251, 244, 0.88);
            border: 1px solid rgba(103, 54, 16, 0.12);
            box-shadow: 0 20px 50px rgba(118, 66, 17, 0.16);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #8f3f08;
            background: rgba(199, 91, 18, 0.12);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 6vw, 4.6rem);
            line-height: 0.98;
        }

        p {
            margin: 0 0 24px;
            color: #715640;
            font-size: 1.04rem;
            line-height: 1.75;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        a {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 15px;
        }

        .primary {
            color: #fff8f1;
            background: linear-gradient(135deg, #c75b12, #8f3f08);
        }

        .secondary {
            color: #8f3f08;
            background: rgba(143, 63, 8, 0.08);
        }
    </style>
</head>

<body>
<section class="panel">
    <div class="eyebrow">Flask Structured Output</div>
    <h1>Recipe image analysis now has its own page.</h1>
    <p>
        This demo takes an uploaded food image, extracts likely ingredients
        with structured output, and suggests three recipes. Open the dedicated
        page below to use the upload flow.
    </p>

    <div class="links">
        <a class="primary" href="{{ url_for('home') }}">Open Recipe Vision</a>
        <a class="secondary" href="{{ url_for('health_check') }}">Health Check</a>
    </div>
</section>
</body>
</html>
